server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA routing: serve index.html for all routes that don't map to a real file
    # Required so that deep links (e.g. /livres/42) work after a hard refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
