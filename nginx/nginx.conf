# nginx reverse proxy configuration
# Stub — completed in Story 1.4 with TLS, static serving, and /api proxy_pass

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (Story 1.4)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # TLS configuration — Story 1.4
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — strip /api prefix, forward to backend container
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
